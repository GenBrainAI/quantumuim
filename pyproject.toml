[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumium"
version = "0.1.0"
description = "Quantum computing SDK — circuits, algorithms, hardware backends, and error mitigation for NISQ and beyond"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Quantumium Contributors", email = "info@quantumium.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["quantum", "computing", "qubits", "simulation", "algorithms", "NISQ", "VQE", "QAOA", "quantum-machine-learning"]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.13", "qiskit-ibm-runtime>=0.20"]
cirq = ["cirq-core>=1.3"]
braket = ["amazon-braket-sdk>=1.70"]
all-backends = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "qiskit-ibm-runtime>=0.20",
    "cirq-core>=1.3",
    "amazon-braket-sdk>=1.70",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/GenBrainAI/quantumuim"
Repository = "https://github.com/GenBrainAI/quantumuim"
Documentation = "https://github.com/GenBrainAI/quantumuim/blob/main/docs/getting-started.md"
Changelog = "https://github.com/GenBrainAI/quantumuim/blob/main/CHANGELOG.md"
Issues = "https://github.com/GenBrainAI/quantumuim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
