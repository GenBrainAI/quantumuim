[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumium"
version = "0.3.0"
description = "Quantum computing SDK — circuits, algorithms, hardware backends, and error mitigation for NISQ and beyond"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Quantumium Contributors", email = "info@quantumium.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["quantum", "computing", "qubits", "simulation", "algorithms", "NISQ", "VQE", "QAOA", "quantum-machine-learning"]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.13", "qiskit-ibm-runtime>=0.20"]
cirq = ["cirq-core>=1.3"]
braket = ["amazon-braket-sdk>=1.70"]
viz = ["matplotlib>=3.8"]
all-backends = [
    "qiskit>=1.0",
    "qiskit-aer>=0.13",
    "qiskit-ibm-runtime>=0.20",
    "cirq-core>=1.3",
    "amazon-braket-sdk>=1.70",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "matplotlib>=3.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[project.scripts]
quantumium = "quantumium.cli:main"

[project.urls]
Homepage = "https://github.com/GenBrainAI/quantumuim"
Repository = "https://github.com/GenBrainAI/quantumuim"
Documentation = "https://genbrainai.github.io/quantumuim"
Changelog = "https://github.com/GenBrainAI/quantumuim/blob/main/CHANGELOG.md"
Issues = "https://github.com/GenBrainAI/quantumuim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantumium = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = [
    "E741",  # ambiguous variable name — I, l, O are standard in quantum computing (identity gate, etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
"src/quantumium/qplus/tests/*" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/quantumium/qplus/tests"]

[tool.coverage.run]
source = ["quantumium"]
omit = ["*/backends/qiskit_*", "*/backends/cirq_*", "*/backends/braket_*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "qiskit_ibm_runtime.*",
    "cirq.*",
    "cirq_google.*",
    "braket.*",
]
ignore_missing_imports = true
