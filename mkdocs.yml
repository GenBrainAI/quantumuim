site_name: Quantumium
site_description: Quantum computing SDK for Python — circuits, algorithms, simulation, and hardware backends
site_url: https://genbrainai.github.io/quantumuim
repo_url: https://github.com/GenBrainAI/quantumuim
repo_name: GenBrainAI/quantumuim
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
    - Bell State & Entanglement: tutorials/bell-state.md
    - VQE for Molecular Chemistry: tutorials/vqe.md
    - "Q+: Factor with Fewer Qubits": tutorials/qplus.md
  - Examples: examples.md
  - API Reference:
    - Core (Circuit, Gates, Noise): api/core.md
    - Algorithms: api/algorithms.md
    - Q+ Algorithm: api/qplus.md
    - Transpiler & Routing: api/transpiler.md
    - Backends (IBM, Google, Amazon): api/backends.md
    - Applications (Chemistry, Finance, ML): api/applications.md
    - Advanced: api/advanced.md
  - Visualization: visualization.md
  - Interoperability: interop.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md
  - Changelog: changelog.md
